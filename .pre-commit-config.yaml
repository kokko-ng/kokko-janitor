repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.47.0
    hooks:
      - id: markdownlint
        args: [--fix]

  # shellcheck-py, not koalaman/shellcheck-precommit: the latter runs shellcheck
  # in a container, so every `pre-commit run` needs a working Docker daemon.
  # This one ships the same binary as a Python wheel. Same shellcheck version,
  # no daemon.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.2
    hooks:
      # Lint only. `ruff-format` would rewrite hotspots.py wholesale; that is
      # its own commit, not a side effect of adding pre-commit.
      - id: ruff
        args: [--fix]
